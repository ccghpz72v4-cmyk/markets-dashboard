<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Markets Dashboard</title>

  <style>
    body {
      margin: 0;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }

    .ticker {
      width: 100%;
      margin-bottom: 20px;
    }

    .chart {
      width: 100%;
      height: 650px;
    }

    .title {
      padding: 18px 20px 10px;
      font-size: 24px;
      font-weight: 600;
    }
  </style>
</head>

<body>

<div class="page">

  <div class="title">
    📈 Markets Dashboard
  </div>

  <!-- TradingView Ticker Tape -->
  <div class="ticker">

    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>

      <script
        type="text/javascript"
        src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js"
        async
      >
      {
        "symbols": [
          {
            "description": "S&P 500",
            "proName": "SP:SPX"
          },
          {
            "description": "Nasdaq 100",
            "proName": "NASDAQ:NDX"
          },
          {
            "description": "FTSE 100",
            "proName": "FTSE:UKX"
          },
          {
            "description": "Gold",
            "proName": "OANDA:XAUUSD"
          },
          {
            "description": "Bitcoin",
            "proName": "BITSTAMP:BTCUSD"
          },
          {
            "description": "Apple",
            "proName": "NASDAQ:AAPL"
          },
          {
            "description": "Microsoft",
            "proName": "NASDAQ:MSFT"
          },
          {
            "description": "Nvidia",
            "proName": "NASDAQ:NVDA"
          }
        ],

        "showSymbolLogo": true,
        "colorTheme": "light",
        "isTransparent": false,
        "displayMode": "adaptive",
        "locale": "en"
      }
      </script>

    </div>

  </div>


  <!-- TradingView Interactive Chart -->

  <div class="chart">

    <div
      class="tradingview-widget-container"
      style="height:100%;width:100%"
    >

      <div
        class="tradingview-widget-container__widget"
        style="height:calc(100% - 32px);width:100%"
      ></div>

      <script
        type="text/javascript"
        src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js"
        async
      >
      {
        "allow_symbol_change": true,
        "calendar": false,
        "details": false,
        "hide_side_toolbar": false,
        "hide_top_toolbar": false,
        "hide_legend": false,
        "hide_volume": false,
        "hotlist": false,
        "interval": "D",
        "locale": "en",
        "save_image": true,
        "style": "1",
        "symbol": "SP:SPX",
        "theme": "light",
        "timezone": "Europe/London",
        "backgroundColor": "#ffffff",
        "gridColor": "rgba(46, 46, 46, 0.08)",
        "watchlist": [],
        "withdateranges": true,
        "compareSymbols": [],
        "support_host": "https://www.tradingview.com",
        "studies": [],
        "autosize": true
      }
      </script>

    </div>

  </div>

</div>

</body>
</html>
