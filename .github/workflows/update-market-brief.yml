name: Update Market Brief

on:
  schedule:
    - cron: "30 6 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate market brief, news and company events
        run: python generate_brief.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/brief.json data/world-news.json data/company-events.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update market dashboard data"
            git push
          fi
