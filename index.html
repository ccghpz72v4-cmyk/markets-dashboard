<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markets Dashboard</title>

  <script type="module"
    src="https://widgets.tradingview-widget.com/w/en/tv-tickers.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    .container {
      max-width: 1400px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 35px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.08);
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📈 Markets Dashboard</h1>

  <!-- MARKET TICKERS -->
  <div class="card">
    <tv-tickers
      symbols="FOREXCOM:SPXUSD,FOREXCOM:NSXUSD,FOREXCOM:UKXGBP,OANDA:XAUUSD,TVC:USOIL,TVC:US10Y,FX:GBPUSD,FX:EURUSD,BITSTAMP:BTCUSD"
      hide-chart>
    </tv-tickers>
  </div>

  <h2>📰 Market Brief</h2>

  <div class="card">
    <p>
      Your automated daily market brief will appear here.
    </p>
  </div>

  <h2>🌍 Today's Top Stories</h2>

  <div class="card">

    <!-- TradingView Top Stories -->
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>

      <script
        type="text/javascript"
        src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js"
        async>
      {
        "feedMode": "all_symbols",
        "colorTheme": "light",
        "isTransparent": false,
        "displayMode": "regular",
        "width": "100%",
        "height": 550,
        "locale": "en"
      }
      </script>

    </div>

  </div>

  <h2>📅 Economic Calendar</h2>

  <div class="card">

    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>

      <script
        type="text/javascript"
        src="https://s3.tradingview.com/external-embedding/embed-widget-events.js"
        async>
      {
        "colorTheme": "light",
        "isTransparent": false,
        "locale": "en",
        "countryFilter": "gb,us,eu,de,fr,cn,jp,ca,au",
        "importanceFilter": "1",
        "width": "100%",
        "height": 600
      }
      </script>

    </div>

  </div>

  <h2>📈 Main Chart</h2>

  <div class="card">

    <div class="tradingview-widget-container">
      <div id="tradingview_chart"></div>

      <script
        type="text/javascript"
        src="https://s3.tradingview.com/tv.js">
      </script>

      <script type="text/javascript">
        new TradingView.widget({
          "width": "100%",
          "height": 650,
          "symbol": "FOREXCOM:SPXUSD",
          "interval": "D",
          "timezone": "Europe/London",
          "theme": "light",
          "style": "1",
          "locale": "en",
          "allow_symbol_change": true,
          "container_id": "tradingview_chart"
        });
      </script>

    </div>

  </div>

</div>

</body>
</html>
